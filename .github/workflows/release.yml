name: CI / Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     platform: linux,   arch: x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux,   arch: aarch64 }
          - { os: macos-14,         platform: macos,   arch: aarch64 }
          - { os: windows-2022,     platform: windows, arch: x86_64 }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        shell: bash
        run: npm run tauri -- build

      - name: Collect release assets
        shell: bash
        run: |
          set -e
          mkdir -p release-assets
          BUNDLE="src-tauri/target/release/bundle"
          case "${{ matrix.platform }}" in
            linux)
              find "$BUNDLE" -maxdepth 2 -name '*.AppImage' -exec cp {} release-assets/ \;
              find "$BUNDLE" -maxdepth 2 -name '*.deb'     -exec cp {} release-assets/ \;
              find "$BUNDLE" -maxdepth 2 -name '*.rpm'     -exec cp {} release-assets/ \;
              ;;
            macos)
              find "$BUNDLE" -maxdepth 2 -name '*.dmg'     -exec cp {} release-assets/ \;
              ;;
            windows)
              find "$BUNDLE" -maxdepth 2 -name '*.exe'     -exec cp {} release-assets/ \;
              find "$BUNDLE" -maxdepth 2 -name '*.msi'     -exec cp {} release-assets/ \;
              ;;
          esac
          ls -la release-assets/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assistant-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
