[package]
name = "openlearn-next-assistant"
version = "0.1.14"
description = "OpenLearn-Next 启动 / 停止 GUI 助手（通过 npx 运行）"
authors = ["OpenLearn Assistant"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
opt-level = "z"     # optimize for size
lto = true
strip = true
panic = "abort"
