[package]
name = "openlearn-next-assistant"
version = "0.1.2"
description = "OpenLearn-Next 安装 / 卸载 / 升级 / 启动 / 停止 GUI 助手"
authors = ["OpenLearn Assistant"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
# Windows elevated extraction uses PowerShell; no extra crates needed.

[features]
# Offline build embeds Node 22 + openlearn-next tarball into the binary.
default = []
offline = []

[profile.release]
opt-level = "z"     # optimize for size
lto = true
strip = true
panic = "abort"
